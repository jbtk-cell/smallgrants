[project]
name = "smallgrants"
version = "0.1.0"
description = "An open index of US foundation giving, built from IRS Form 990-PF bulk filings"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "inflate64>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
smallgrants = "smallgrants.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smallgrants"]

[tool.pytest.ini_options]
testpaths = ["tests"]
